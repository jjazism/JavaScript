<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro CódigoJS</title>
    <style>
        body {
            background-color:rgb(134, 116, 116);
            color: rgb(0, 0, 0);
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1> Olá, Mundo</h1>

    <p>Já me livrei da maldição</p>

    <script>
       var nome = window.prompt ("Qual é o seu nome?") //mensagem de prompt com botão OK e Cancelar, pedindo para o usuário digitar seu nome
       window.alert ("Seja Bem-vindo " + nome + " !!!") //mensagem de alerta com botão OK dando boas vindas ao usuário, concatenando a mensagem com o nome digitado
    </script>
</body>
</html>
