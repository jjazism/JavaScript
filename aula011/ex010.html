<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> Km/H
    <input type="button" value="calcular" onclick="calcular()">
    <div id="res">
        
    </div>

    <script>
        function calcular () {
            var txtvel = window.document.querySelector(`input#txtvel`)
            var res = window.document.querySelector(`div#res`)
            var vel = Number(txtvel.value)
            res.innerHTML = ` <p> Sua velocidade atual é de <strong> ${vel} </strong>  Km/H </p>`
        if (vel > 50) {
            res.innerHTML += `<p> Voce esta acima da velocidade <strong> MULTADO </strong> </p>`
        }
        res.innerHTML += ` <p> Dirija sempre com CUIDADO! </P>`
        }
    </script>
</body>
</html>
