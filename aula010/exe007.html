<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        div#res{
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Somando Números</h1>

    <input type="number" name="txt1" id="txt1"> +
    <input type="number" name="txt2" id="txt2"> =
    <input type="button" value="somar" onclick="somar()">
    
    <div id="res">
        Resultado
    </div>

    <script>
        function somar() {
        var n1 = window.document.getElementById('txt1')
        var n2 = window.document.getElementById('txt2')
        var res = window.document.getElementById('res')
        n1 = Number(n1.value)
        n2 = Number(n2.value)

        var s = n1 + n2
        res.innerHTML = `O resultado da soma entre ${n1} e ${n2} é <strong>${s}</strong>`
        

        }
    </script>
    
</body>
</html>
