<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro CódigoJS</title>
    <style>
        body {
            background-color:rgb(110, 161, 173);
            color: rgb(0, 0, 0);
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1> Olá, Mundo</h1>

    <p>Já me livrei da maldição</p>

    <script>
        window.alert ("Bem-vindo") //mensagem de alerta com botão OK dando boas vindas ao usuário
        window.confirm ("Deseja continuar?") //mensagem de confirmação com botão OK e Cancelar, perguntando se o usuário deseja continuar
        window.prompt ("Qual é o seu nome?") //mensagem de prompt com botão OK e Cancelar, pedindo para o usuário digitar seu nome
    </script>
</body>
</html>
